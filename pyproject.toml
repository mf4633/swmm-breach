[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swmm-breach"
version = "0.4.0"
description = "Dam breach hydrograph generator for EPA SWMM and PCSWMM"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michael Flynn", email = "michaelbflynn@gmail.com" }]
keywords = ["hydrology", "dam-breach", "swmm", "pcswmm", "froehlich", "dam-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/mf4633/swmm-breach"
Issues = "https://github.com/mf4633/swmm-breach/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/swmm_breach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
